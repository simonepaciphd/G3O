<script>
"use strict";
const DATA=JSON.parse(document.getElementById('page-data').textContent);
const SHA=DATA._sha256, KEY='decision-page:'+DATA.id+':'+SHA.slice(0,12);
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function inline(s){return esc(s).replace(/`([^`]+)`/g,'<code>$1</code>').replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>')}
function rich(text){return String(text??'').trim().split(/\n\s*\n/).map(block=>{const lines=block.split('\n');if(lines.every(l=>/^\s*- /.test(l)))return '<ul>'+lines.map(l=>'<li>'+inline(l.replace(/^\s*- /,''))+'</li>').join('')+'</ul>';return '<p>'+lines.map(inline).join('<br>')+'</p>'}).join('')}
const EXTRA=[['pending','Leave pending / decide later'],['other','Other — see my comments']];
const REVIEW_DEFAULT=[{id:'approve',label:'Approve as is'},{id:'approve-with-changes',label:'Approve with the changes in my comments'},{id:'revise',label:'Revise and resubmit'},{id:'reject',label:'Reject'}];
const itemOptions=it=>(it.options&&it.options.length)?it.options:(it.kind==='review'?REVIEW_DEFAULT:[]);
const choicesOf=it=>[...itemOptions(it).map(o=>[o.id,o.label]),...EXTRA];

$('eyebrow').textContent=DATA.eyebrow||'Decision set';
$('title').textContent=DATA.title;
const pb=DATA.prepared_by||{};
$('meta').textContent=['Prepared '+DATA.prepared,DATA.project&&('Project: '+DATA.project),[pb.harness,pb.model].filter(Boolean).join(' · ')&&('By '+[pb.harness,pb.model].filter(Boolean).join(' · ')),'Agent draft — your choices decide'].filter(Boolean).join(' · ');
$('background-body').innerHTML=rich(DATA.background);
$('sources').innerHTML=(DATA.sources||[]).length?'<h4>Sources</h4>'+DATA.sources.map(s=>`<a href="${esc(s.href)}">${esc(s.label)}</a>`).join(''):'';
const nDec=DATA.items.filter(i=>i.kind!=='review').length,nRev=DATA.items.length-nDec;
$('items-heading').textContent=nRev&&nDec?'Decisions and reviews':(nRev?'Reviews':'Decisions');

function optionCard(it,o){
  const rec=it.recommendation&&it.recommendation.option===o.id;
  const rows=[['How it works',o.mechanism],['Benefits',o.benefits],['Risks',o.risks],['Commits you to',o.commits_to]].filter(r=>r[1]);
  return `<div class="option${rec?' recommended':''}"><h4>${esc(o.id)}. ${inline(o.label)}${rec?' — <em>recommended</em>':''}</h4>${rows.map(([k,v])=>`<p><b>${k}:</b> ${inline(v)}</p>`).join('')}${o.irreversible?`<p class="irrev">Cannot be undone: ${inline(o.irreversible)}</p>`:''}</div>`;
}
function positionBlock(it){
  if(it.kind==='substantive')return `<div class="position substantive"><strong>Your call:</strong> no recommendation on a substantive decision.</div>`;
  if(it.recommendation)return `<div class="position"><strong>Recommendation: ${esc(it.recommendation.option)}.</strong> ${inline(it.recommendation.reason)}</div>`;
  return it.kind==='review'?'':`<div class="position"><strong>No recommendation offered.</strong></div>`;
}
$('item-cards').innerHTML=DATA.items.map(it=>{
  const opts=it.kind==='review'?[]:itemOptions(it);
  const type=it.allow_multiple?'checkbox':'radio';
  return `<article class="card" id="item-${esc(it.id)}"><div class="card-head"><span class="num">${esc(it.id)}</span><h3>${inline(it.title)}</h3><span class="kind ${esc(it.kind)}">${esc(it.kind)}</span></div>
  <div class="rich">${rich(it.situation)}</div>
  ${it.body?`<details class="body" ${it.kind==='review'?'open':''}><summary>${esc(it.body_label||'Read the full text')}</summary><div class="rich">${rich(it.body)}</div></details>`:''}
  ${opts.length?'<div class="options">'+opts.map(o=>optionCard(it,o)).join('')+'</div>':''}
  ${positionBlock(it)}
  <fieldset><legend>Your ${it.kind==='review'?'verdict':'choice'}${it.allow_multiple?' (select all that apply)':''}</legend>${choicesOf(it).map(([v,t])=>`<label class="choice"><input type="${type}" name="choice-${esc(it.id)}" value="${esc(v)}" data-field="${esc(it.id)}:choice"><span>${v==='pending'||v==='other'||!itemOptions(it).some(o=>o.id===v)||(it.kind==='review'&&!(it.options&&it.options.length))?'':esc(v)+'. '}${inline(t)}</span></label>`).join('')}</fieldset>
  <label class="field-label" for="notes-${esc(it.id)}">Comments</label><textarea id="notes-${esc(it.id)}" data-field="${esc(it.id)}:notes" placeholder="${esc(it.prompt||'Conditions, corrections, questions…')}"></textarea></article>`;
}).join('');

const fields=[...document.querySelectorAll('[data-field]')];
function readAnswers(){const a={};fields.forEach(el=>{const k=el.dataset.field;if(el.type==='radio'){if(el.checked)a[k]=el.value}else if(el.type==='checkbox'&&k.endsWith(':choice')){if(el.checked)(a[k]=a[k]||[]).push(el.value)}else a[k]=el.type==='checkbox'?el.checked:el.value});return a}
function writeAnswers(a){fields.forEach(el=>{const k=el.dataset.field,v=a[k];if(el.type==='radio')el.checked=v===el.value;else if(el.type==='checkbox'&&k.endsWith(':choice'))el.checked=Array.isArray(v)&&v.includes(el.value);else if(el.type==='checkbox')el.checked=!!v;else el.value=v??''})}
function labelFor(it,v){const m=new Map(choicesOf(it));return Array.isArray(v)?v.map(x=>m.get(x)||x):(v?m.get(v)||v:null)}
function reply(){const a=readAnswers();return{format:'decision-page-reply-v1',page_id:DATA.id,page_title:DATA.title,page_sha256:SHA,project:DATA.project||null,saved_at:new Date().toISOString(),
  answers:DATA.items.map(it=>{const c=a[it.id+':choice'];return{id:it.id,title:it.title,kind:it.kind,choice:(Array.isArray(c)?(c.length?c:null):(c||null)),choice_label:labelFor(it,c),recommended:it.recommendation?it.recommendation.option:null,comments:(a[it.id+':notes']||'').trim()}}),
  overall:(a.overall||'').trim()}}
function replyText(){const r=reply(),L=[`DECISION REPLY — ${DATA.title}`,`Page: ${DATA.id} · ${SHA.slice(0,12)}`,''];
  r.answers.forEach(x=>{const lab=Array.isArray(x.choice_label)?x.choice_label.join('; '):x.choice_label;L.push(`${x.id}. ${x.title}`,`  Choice: ${x.choice?(Array.isArray(x.choice)?x.choice.join(', '):x.choice)+' — '+lab:'(none selected)'}`,`  Comments: ${x.comments||'(none)'}`,'')});
  L.push('OTHER COMMENTS',r.overall||'(none)','','```json',JSON.stringify(r,null,2),'```');return L.join('\n')}
function refresh(){const a=readAnswers();let n=0;DATA.items.forEach(it=>{const c=a[it.id+':choice'],d=Array.isArray(c)?c.length>0:!!c;if(d)n++;$('item-'+it.id).classList.toggle('done',d)});$('progress').textContent=`${n} of ${DATA.items.length} answered`;$('reply-preview').value=replyText()}
function save(){refresh();try{localStorage.setItem(KEY,JSON.stringify(readAnswers()));$('save-state').textContent='Draft saved in this browser · '+new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})+' · Save the .json for a copy you can hand back.'}catch(e){$('save-state').textContent='Browser draft storage is unavailable here. Save the .json before closing.'}}
try{const s=localStorage.getItem(KEY);if(s)writeAnswers(JSON.parse(s))}catch(e){}
document.addEventListener('input',e=>{if(e.target.dataset&&e.target.dataset.field)save()});
document.addEventListener('change',e=>{if(e.target.dataset&&e.target.dataset.field)save()});
const say=t=>$('announce').textContent=t;
async function copyReply(){try{if(!navigator.clipboard?.writeText)throw Error();await navigator.clipboard.writeText(replyText());say('Copied. Paste it into the chat.')}catch(e){$('reply').scrollIntoView();$('preview').open=true;const o=$('reply-preview');o.focus();o.select();say('Selected below — press Ctrl+C, then paste into the chat.')}}
function download(text,name,type){const url=URL.createObjectURL(new Blob([text],{type})),l=document.createElement('a');l.href=url;l.download=name;document.body.append(l);l.click();l.remove();setTimeout(()=>URL.revokeObjectURL(url),2000);say(`Saved ${name} to your downloads. Give the agent its path, or attach it.`)}
$('copy').onclick=copyReply;$('top-copy').onclick=copyReply;
$('download-json').onclick=()=>download(JSON.stringify(reply(),null,2),DATA.id+'.reply.json','application/json');
$('download-txt').onclick=()=>download(replyText(),DATA.id+'.reply.txt','text/plain;charset=utf-8');
$('load-json').onclick=()=>$('load-file').click();
$('load-file').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{const r=JSON.parse(await f.text());if(r.page_id!==DATA.id)throw Error('That file is for a different page ('+r.page_id+').');const a={overall:r.overall||''};r.answers.forEach(x=>{a[x.id+':choice']=x.choice;a[x.id+':notes']=x.comments});writeAnswers(a);save();say('Answers loaded'+(r.page_sha256!==SHA?' (page content has changed since they were saved — re-check each item).':'.'))}catch(err){say('Could not load: '+err.message)}e.target.value=''};
$('reset').onclick=()=>{writeAnswers({});try{localStorage.removeItem(KEY)}catch(e){}refresh();say('Draft cleared.')};
refresh();
</script>
