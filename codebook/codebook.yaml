      source: codebook-rulings-round3.json all-10 (choice a); option text questions-r3.json all-10.a.mechanism
      approved_r4: 'PI 2026-10-30 "approve all" (round 4): page shared card I01 slot 7'
    translation_v25:
      map:
        _NA_: _NA_
        unknown: unknown
        not_documented: unknown
        not_asked: not asked (shown with a version label)
      origin: PI 2026-10-30 "all review approved"; agent draft r4 translation
      source: drafts/translation-r4.json missing_labels_convention
