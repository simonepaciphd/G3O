    - code: from_metadata
      definition:
        text: |-
          The value comes from the page's metadata or its web address, or is the date the page was fetched; it is not read from the page text.
        origin: PI 2026-10-30 "approve all"; agent draft r4
        source: |-
          drafts/definitions-r4.json entries[0] (vocabularies/provenance/values/1/definition); confidence medium
