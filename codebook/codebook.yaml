  genai_era_cutoff:
    text:
      text: |-
        One shared date of 1 November 2022, with "before" needing proof. Date origin is recorded as metadata, web address, quote from page text, archive upper bound, or unknown; the AI-text code changes.
      origin: r2
      source: codebook-rulings-round2.json n=31
      approved_r4: 'PI 2026-10-30 "approve all" (round 4): page shared card I05 slot 1'
shared_rules:
  core.rule.genai_boundary:
  - text: |-
      Generative-AI wording: the re-pilot 2 wording governs (SRC-7 L34-45), including that a named "AI chatbot or AI assistant" counts as a generative product; `system_prompt.md` L15 rule ("chatbot" alone is not evidence) is amended to match. A named "AI chatbot" or "AI assistant" counts as generative and overrides the rule-based-chatbot exclusion (contract L12) for that naming.
    origin: spec
    source: SPEC.md:81 R-016
    approved_r4: 'PI 2026-10-30 "approve all" (round 4): page shared card I06 slot 1'
  - text: |-
      S1 a: translation counts as generative AI only when the page ties it to a named generative product or says a language model produces it.
    origin: delta
    source: RC-D-002.md:71
    approved_r4: 'PI 2026-10-30 "approve all" (round 4): page shared card I06 slot 2'
  core.rule.activity_unit:
  - text: |-
      One activity = one action (deployment, governance instrument, staff training) by one actor concerning one tool or instrument. A named program is one activity; each named component is its own activity, linked to the program as a component of it. Repeated transactions for the same product by the same unit are one activity. A policy and the tools it approves are separate activities, linked by a "governs" relation.
    origin: spec
    source: SPEC.md:82 R-017
    approved_r4: 'PI 2026-10-30 "approve all" (round 4): page shared card I07 slot 1'
  core.rule.ws10_event:
  - text: |-
      WS10 D1 action boundary: a public-facing GenAI event or educational programme is not a qualifying activity; an event page can support a separate record only when it documents the institution's own adoption, procurement, deployment or governance.
    origin: spec
    source: SPEC.md:75 R-010
    approved_r4: 'PI 2026-10-30 "approve all" (round 4): page shared card I08 slot 1'
  core.rule.ws10_governance:
  - text: |-
      WS10 D2: formal institution-issued GenAI governance qualifies whether it governs staff or external users; governance is recorded separately from deployment.
    origin: spec
    source: SPEC.md:76 R-011
    approved_r4: 'PI 2026-10-30 "approve all" (round 4): page shared card I09 slot 1'
  core.rule.ws10_excluded_only:
  - text: |-
      WS10 D3: a completed review containing only clearly excluded events yields no qualifying evidence with exclusion reasons preserved; genuinely uncertain signals stay unclear.
    origin: spec
    source: SPEC.md:77 R-012
    approved_r4: 'PI 2026-10-30 "approve all" (round 4): page shared card I10 slot 1'
  core.rule.ws10_proposals:
  - text: 'WS10 D4: institution-specific, explicitly GenAI proposals remain a qualifying activity.'
    origin: spec
    source: SPEC.md:78 R-013
    approved_r4: 'PI 2026-10-30 "approve all" (round 4): page shared card I11 slot 1'
  core.rule.attribution_grain:
  - text: |-
      An activity carried out by an organisational unit of the named institution (department, office, service) counts for the named institution. An activity of its parent, a sibling, or a separate court, board or authority does not, unless the page says the named institution takes part.
    origin: r1
    source: codebook-rulings-round1.json C04.mechanism
    approved_r4: 'PI 2026-10-30 "approve all" (round 4): page shared card I12 slot 1'
  - text: A joint activity counts when the page names this institution as a participant.
    origin: r1
    source: codebook-rulings-round1.json C04.mechanism
    approved_r4: 'PI 2026-10-30 "approve all" (round 4): page shared card I12 slot 2'
  core.rule.v26_detail_fields:
  - text: |-
      v2.6 rules: observed actor distinguished from query target; each detail field independently supported or cleared; every source keeps its disposition, reason and original mention; page-level extraction cannot issue institution-wide `no`.
    origin: spec
    source: SPEC.md:79 R-014
    approved_r4: 'PI 2026-10-30 "approve all" (round 4): page shared card I13 slot 1'
  core.rule.safeguard_attachment:
  - text: |-
      A safeguard in a governance activity is not copied to deployment activities in pass 2. Stage 6 may link them only through a recorded relation.
    origin: r1
    source: codebook-rulings-round1.json C18.mechanism
    approved_r4: 'PI 2026-10-30 "approve all" (round 4): page shared card I14 slot 1'
  - text: A contract with safeguard clauses is split off as a governance activity linked to the tool.
    origin: ruling-r3
    source: |-
      codebook-rulings-round3.json activity-06 (choice b); option text questions-r3.json activity-06.b.mechanism
    approved_r4: 'PI 2026-10-30 "approve all" (round 4): page shared card I14 slot 2'
  core.rule.stated_only:
  - text: Documented performance claims. Only record if explicitly stated. Never infer.
    origin: v25
    source: output_contract.md:111 col reported_outcomes
    approved_r4: 'PI 2026-10-30 "approve all" (round 4): page shared card I15 slot 1'
  core.rule.cx_grain:
  - text: |-
      **Page fields** (`disclosure_form`, `disclosure_scope`, the optional `content_*` items) are properties of the source page. They are coded once per (institution × page), on the stored page text the item declares as its input (the main text unless the item states otherwise), and copied to every evidence row from that page. The `content_*` items that CX-51 and CX-52 mark as derived are not asked; they are computed once per page from the codes of the activities on that page.
    origin: agent-draft
    source: cx-01.3-draft.json CX-01; ruling page-05
    draft_action: edit
    frozen_text: |-
      **Page fields** (`disclosure_form`, `disclosure_scope`, the optional `content_*` items) are properties of the source page. They are coded once per (institution × page), on the stored page text, and copied to every evidence row from that page.
    frozen_source: codebook-extension-proposal.md:20 CX-01
    approved_r4: 'PI 2026-10-30 "approve all" (round 4): page shared card I16 slot 1'
  - text: |-
      **Finding fields** (`evaluation_documented`, optional `evaluation_type_*`, and the outcome and incident items of CX-61) are coded per (finding × page). The state given to jev is the page text plus that finding's `activity_name`, `activity_type`, `adoption_stage` and `tool_name`. The state of each question set (its fields, their order and the chunk marker) is pinned in the codebook and is part of the frozen instrument; any change to it counts as a wording change.
    origin: agent-draft
    source: cx-01.3-draft.json CX-02; ruling activity-25
    draft_action: edit
    frozen_text: |-
      **Finding fields** (`evaluation_documented`, optional `evaluation_type_*`) are coded per (finding × page). The state given to jev is the page text plus that finding's `activity_name`, `activity_type`, `adoption_stage` and `tool_name`.
    frozen_source: codebook-extension-proposal.md:21 CX-02
    approved_r4: 'PI 2026-10-30 "approve all" (round 4): page shared card I16 slot 2'
  - text: |-
      Code what the page says. Never use outside knowledge of the institution, the country's laws or the register system.
    origin: agent-draft
    source: cx-01.3-draft.json CX-03; ruling none (no round-3 item names this row)
    draft_action: no_change
    frozen_text: |-
      Code what the page says. Never use outside knowledge of the institution, the country's laws or the register system.
    frozen_source: codebook-extension-proposal.md:22 CX-03
    approved_r4: 'PI 2026-10-30 "approve all" (round 4): page shared card I16 slot 3'
  - text: |-
      The codebook stores page-level and finding × page codes only. How page codes roll up to a finding, institution or country is an index decision (index decisions 6–8), not a codebook rule.
    origin: agent-draft
    source: cx-01.3-draft.json CX-04; ruling none (no round-3 item names this row)
    draft_action: no_change
    frozen_text: |-
