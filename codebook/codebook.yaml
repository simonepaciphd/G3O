          codebook-rulings-round3.json shared-02 (choice a); option text questions-r3.json shared-02.a.mechanism
        approved_r4: 'PI 2026-10-30 "approve all" (round 4): page shared card I02 slot 5'
      code_source: value-lists.json vocabularies.provenance values[4]; ruling all-11
    text:
      text: |-
        Every 'how we know' field uses the same five values: stated, from metadata, looked up, derived, quoted by the quote step. The per-run version record also holds the codebook version, the channel tag stays on each row, and per-code coder details are stored internally and linked to that record.
      origin: r2
      source: codebook-rulings-round2.json n=57
      approved_r4: 'PI 2026-10-30 "approve all" (round 4): page shared card I02 slot 6'
    date_origin_map:
