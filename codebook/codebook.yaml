    values:
    - code: stated
      definition:
        text: '"Stated" = the page says it, whoever copied it'
        origin: ruling-r3
        source: |-
          codebook-rulings-round3.json shared-02 (choice a); option text questions-r3.json shared-02.a.mechanism
        approved_r4: 'PI 2026-10-30 "approve all" (round 4): page shared card I02 slot 1'
