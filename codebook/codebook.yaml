        text: |-
          The value was found in a source other than the page itself, such as a web archive's record of when the page first appeared.
        origin: PI 2026-10-30 "approve all"; agent draft r4
        source: |-
          drafts/definitions-r4.json entries[1] (vocabularies/provenance/values/2/definition); confidence medium
        source_before_r4: value looked_up
