combining_conventions:
  check_then_combine:
    rulings:
    - all-03
    text:
    - text: |-
        Each part's answer is checked (quote, 0.8 bar) before combining; downgraded parts enter as their downgrade target (`unknown`), except page verdicts, which keep their value and the downgraded tag.
      origin: PI 2026-10-30 "approved!"; fixes-r4 FX13
      source: combining-rules.json conventions.downgrade_first; ruling all-03
      approved_r4: 'PI 2026-10-30 "approve all" (round 4): page shared card I20 slot 1'
      text_before_r4: |-
        Each part's answer is checked (quote, 0.8 bar) before combining; downgraded parts enter as their downgrade target (`unknown`), except page verdicts, which keep their value and the downgraded tag (r2#40).
      origin_before_r4: agent-draft
      r4_fixes: FX13
    - text: |-
        Each part is checked as drafted; the prompt states the text is only part of the document; every question gets a temporary value "not covered by this part"; such parts do not vote when parts are combined; if every part gives it, the page is "not documented"; the temporary value is never published.
      origin: ruling-r3
      source: codebook-rulings-round3.json all-03.reading
      approved_r4: 'PI 2026-10-30 "approve all" (round 4): page shared card I20 slot 2'
    - text: |-
        check each part but add a new to the prompt that this is only part of the doc & add a temporary value to each question "not covered by this part", to be taken into account when combining parts
      origin: ruling-r3
      source: codebook-rulings-round3.json all-03_comment (PI comment, verbatim)
      approved_r4: 'PI 2026-10-30 "approve all" (round 4): page shared card I20 slot 3'
  not_covered_by_this_part:
    rulings:
    - all-03
    temporary_value: not covered by this part
    published: false
    applies_to: every question in every part prompt of a long page
    text:
    - text: |-
        the prompt states the text is only part of the document; every question gets a temporary value "not covered by this part"; such parts do not vote when parts are combined; if every part gives it, the page is "not documented"; the temporary value is never published.
      origin: ruling-r3
      source: codebook-rulings-round3.json all-03.reading
      approved_r4: 'PI 2026-10-30 "approve all" (round 4): page shared card I21 slot 1'
    generator_check_16: the generator must add this value to every part prompt (fold-log-round3.md)
  missing_rank:
    rulings:
    - all-04
    order:
    - real answers
    - not_documented
    - unknown
    text:
    - text: Real answers, then not documented, then unknown
      origin: ruling-r3
      source: codebook-rulings-round3.json all-04 (choice b); option text questions-r3.json all-04.b.label
      approved_r4: 'PI 2026-10-30 "approve all" (round 4): page shared card I22 slot 1'
    - text: A clean reading that the page is silent beats an unclear or failed answer.
      origin: ruling-r3
      source: codebook-rulings-round3.json all-04 (choice b); option text questions-r3.json all-04.b.mechanism
      approved_r4: 'PI 2026-10-30 "approve all" (round 4): page shared card I22 slot 2'
    - text: '`not_asked` never competes, because applicability is applied after the gating item is combined.'
      origin: agent-draft
      source: combining-rules.json conventions.missing_tokens; ruling all-04
      approved_r4: 'PI 2026-10-30 "approve all" (round 4): page shared card I22 slot 3'
  producing_part:
    rulings:
    - all-05
    text:
    - text: |-
        When several parts give the winning value, the producing part is the one with the highest chosen-answer probability (ties: earliest). Its probability and quote become the combined answer's.
      origin: agent-draft
      source: combining-rules.json conventions.producing_part; ruling all-05
      approved_r4: 'PI 2026-10-30 "approve all" (round 4): page shared card I23 slot 1'
    - text: Among parts giving the winning answer, take the highest certainty; ties go to the earliest part.
      origin: ruling-r3
      source: codebook-rulings-round3.json all-05 (choice a); option text questions-r3.json all-05.a.mechanism
      approved_r4: 'PI 2026-10-30 "approve all" (round 4): page shared card I23 slot 2'
  first_part:
    rulings:
    - all-06
    text:
    - text: |-
        Skip silent or failed parts; take the first part with a supported real answer. For pooled evidence, sort by source date, then by position on the page.
      origin: ruling-r3
      source: codebook-rulings-round3.json all-06 (choice a); option text questions-r3.json all-06.a.mechanism
      approved_r4: 'PI 2026-10-30 "approve all" (round 4): page shared card I24 slot 1'
    - text: |-
        The same rules apply to pooled Stage 6 evidence split into parts; first_section there needs a fixed pool order.
      origin: PI 2026-10-30 "approved!"; fixes-r4 FX13
      source: combining-rules.json conventions.stage6; ruling all-06
      approved_r4: 'PI 2026-10-30 "approve all" (round 4): page shared card I24 slot 2'
      text_before_r4: |-
        The same rules apply to pooled Stage 6 evidence split into parts (r2#6); first_section there needs a fixed pool order.
      origin_before_r4: agent-draft
      r4_fixes: FX13
  gate_items_first:
    rulings:
    - all-04
    text:
    - text: activity_type and action_type (and the scale number) are combined before the items they gate.
      origin: agent-draft
      source: combining-rules.json conventions.combine_gate_items_first; ruling all-04
      approved_r4: 'PI 2026-10-30 "approve all" (round 4): page shared card I25 slot 1'
  activity_level:
    rulings: []
    text:
    - text: |-
        Activity items combine the answers about the same activity from every part holding one of its linked passages; parts without a passage do not vote.
      origin: agent-draft
      source: |-
        combining-rules.json conventions.activity_level; ruling none (draft convention; no round-3 item names it)
      approved_r4: 'PI 2026-10-30 "approve all" (round 4): page shared card I26 slot 1'
items:
  core.page_verdict:
    id: core.page_verdict
    family: verdict
    name: page_verdict
    level:
    - page
    pipelines: &id001
    - web_extract
    linkage: jev_choice
    coder: classifier
    pass: 1
    round: 1
    gate: none
    answer_type: single
    instruction:
      text: |-
        Code this PAGE for the named institution only, using only what the page says. Does it document a generative-AI activity at this institution? If several values fit, take the first in this order.
      origin: repilot_q
      source: unclear2.py L84-85 (verdict question instructions)
      approved_r4: 'PI 2026-10-30 "approve all" (round 4): page page card I01 slot 1'
    values:
    - code: confirms_activity
      definition:
        text: |-
          The page documents a specific generative-AI activity AT THIS institution: its own GenAI tool, pilot, policy or guidance on GenAI, procurement, deployment, or institution-directed staff GenAI training. The text must be explicitly generative AI (LLMs, ChatGPT, Copilot, Gemini, AI chatbots, AI-generated content or equivalents) and tied to this institution, not only to a national programme or another body. The activity must be carried out or adopted by the named institution itself. Exclude activity by a parent, higher-level or neighbouring body (e.g. a district, county, regency, region, consortium or city department when the named institution is a village, ward or sub-unit), by a similarly named organisation or company, and pages by vendors that only use the place name. Generic 'AI', 'artificial intelligence', 'smart' systems, automation, analytics, prediction, transcription, translation, image or video recognition, or traditional machine-learning tools do not count unless the page says the tool generates text, images, audio, code or other content, or names a generative product or model (e.g. ChatGPT, Copilot, Gemini, Claude, an LLM, an AI chatbot or AI assistant).
        origin: repilot
        source: unclear2.py VERDICT['confirms_activity'] (L32-54)
        approved_r4: 'PI 2026-10-30 "approve all" (round 4): page page card I01 slot 2'
    - code: ambiguous_genai
      definition:
        text: |-
          The page mentions AI at this institution, but it cannot be settled whether it is generative AI (e.g. a generic 'AI strategy', 'AI tools', analytics, traditional machine learning).
        origin: repilot
        source: unclear2.py VERDICT['ambiguous_genai'] (L32-54)
        approved_r4: 'PI 2026-10-30 "approve all" (round 4): page page card I01 slot 3'
    - code: ambiguous_attribution
      definition:
        text: |-
          The page mentions generative AI, but it cannot be settled whether THIS institution is involved (e.g. a country-wide or regional GenAI initiative without confirmation that this institution takes part, or a page about a similarly named body).
        origin: repilot
        source: unclear2.py VERDICT['ambiguous_attribution'] (L32-54)
        approved_r4: 'PI 2026-10-30 "approve all" (round 4): page page card I01 slot 4'
    - code: other_body
      definition:
        text: |-
          The page documents a generative-AI activity, but it clearly belongs to a different body, not the named institution: a parent, higher-level or neighbouring body (e.g. a district, county, regency, region, consortium or city department when the named institution is a village, ward or sub-unit), a similarly named organisation or company, or a vendor or marketing page that only uses the place name.
        origin: repilot
        source: unclear2.py VERDICT['other_body'] (L32-54)
        approved_r4: 'PI 2026-10-30 "approve all" (round 4): page page card I01 slot 5'
    - code: event_only
      definition:
        text: |-
          The only GenAI content is a public-facing event, workshop, seminar, showcase or educational programme, with no documented adoption, procurement, deployment or governance by the institution itself (WS10 D1: not a qualifying activity).
        origin: repilot
        source: unclear2.py VERDICT['event_only'] (L32-54)
        approved_r4: 'PI 2026-10-30 "approve all" (round 4): page page card I01 slot 6'
    - code: background_only
      definition:
        text: |-
          The page gives only general context (national AI strategy, vendor overview, news about GenAI in general) and documents no activity at this institution.
        origin: repilot
        source: unclear2.py VERDICT['background_only'] (L32-54)
        approved_r4: 'PI 2026-10-30 "approve all" (round 4): page page card I01 slot 7'
    - code: confirms_absence
      definition:
        text: v2.5 `confirms_absence` (page states absence; distinct from `no_genai`, no relevant content)
        origin: spec
        source: SPEC.md:80 R-015
        approved_r4: 'PI 2026-10-30 "approve all" (round 4): page page card I01 slot 8'
    - code: no_genai
      definition:
        text: The page contains no generative-AI content relevant to this institution.
        origin: repilot
        source: unclear2.py VERDICT['no_genai'] (L32-54)
        approved_r4: 'PI 2026-10-30 "approve all" (round 4): page page card I01 slot 9'
    - code: not_assessable
      definition:
        text: |-
          `not_assessable`, set mechanically when a page was not reviewed, never a classifier answer, not blocking institution `no`, and left out of the base for institution-level rates
        origin: PI 2026-10-30 "approved!"; fixes-r4 FX13
        source: SPEC.md:80 R-015
        approved_r4: 'PI 2026-10-30 "approve all" (round 4): page page card I01 slot 10'
        text_before_r4: |-
          `not_assessable`, set mechanically when a page was not reviewed, never a classifier answer, not blocking institution `no` (C1 a), and left out of the base for institution-level rates
        origin_before_r4: spec
        r4_fixes: FX13
    rules:
    - text: |-
        The vocabulary has 9 values: the 8 below plus `not_assessable`, set mechanically when a page was not reviewed, never a classifier answer, not blocking institution `no`, and left out of the base for institution-level rates; in published summaries it is reported as `unknown` and stays a coding value; `page_review_state` keeps only pipeline failures; v2.5 rows stay unconverted and are mapped by the translation table.
      origin: PI 2026-10-30 "approved!"; fixes-r4 FX10, FX11, FX12, FX13
      source: SPEC.md:80 R-015
      approved_r4: 'PI 2026-10-30 "approve all" (round 4): page page card I01 slot 11'
      text_before_r4: |-
        RC-D-002 row 8: the vocabulary has 9 values: the 8 below plus `not_assessable`, set mechanically when a page was not reviewed, never a classifier answer, not blocking institution `no` (C1 a), and left out of the base for institution-level rates; in published summaries it is reported as `unknown` and stays a coding value (all-07 c); `page_review_state` keeps only pipeline failures (r2#7); v2.5 rows stay unconverted and are mapped by the translation table (R-059); A-011 fixtures cover all 9, incl. page-stated absence (C01 commits_to); enum steps count on the codebook release (C-007). [wording: PI — RC-D-002 row 8: value definitions for the 9 values] v001.5 text: Page-verdict vocabulary has 8 values: the 7 re-pilot 2 values (`confirms_activity`, `ambiguous_genai`, `ambiguous_attribution`, `other_body` = v2.6 `other_actor`, `event_only` = v2.6 `excluded_event`, `background_only`, `no_genai`) plus v2.5 `confirms_absence` (page states absence; distinct from `no_genai`, no relevant content). It replaces v2.5 `genai_evidence` in the same column. Rows produced under v2.5 keep their 4-value answers unconverted until the institution is rerun; the row's contract version (R-050) says which vocabulary applies. Rules that read the column (yes needs a `confirms_activity` row; activity fields `_NA_` otherwise) are updated to the 8 values. Enum change: two contract-version steps, procurement notified (C-007).
      origin_before_r4: spec
      r4_fixes: FX10, FX11, FX12, FX13
    - core.rule.genai_boundary
    - core.rule.ws10_event
    - core.rule.attribution_grain
    order_tie_rule: first_in_order
    long_page_rule:
      rule: priority_order
      order: S3 a
      text:
        text: |-
          The verdict order for combining long-page parts has two tiers: supported verdicts in the S3 a order, then failed verdicts in the same order. The S3 a order is: confirms_activity, ambiguous_attribution, ambiguous_genai, other_body, event_only, background_only, confirms_absence, no_genai, not_assessable (`not_assessable` last, for completeness only, C1 a).
        origin: PI 2026-10-30 "approved!"; fixes-r4 FX13
        source: SPEC.md:110 R-044
        approved_r4: 'PI 2026-10-30 "approve all" (round 4): page page card I01 slot 12'
        text_before_r4: |-
          The verdict order for combining long-page parts has two tiers: supported verdicts in the S3 a order, then failed verdicts in the same order (page-02 b). The S3 a order is: confirms_activity, ambiguous_attribution, ambiguous_genai, other_body, event_only, background_only, confirms_absence, no_genai, not_assessable (`not_assessable` last, for completeness only, C1 a).
        origin_before_r4: spec
        r4_fixes: FX13
      tiers:
        text: All supported verdicts in the signed order first, then failed verdicts in the same order.
        origin: ruling-r3
        source: codebook-rulings-round3.json page-02 (choice b); option text questions-r3.json page-02.b.mechanism
        approved_r4: 'PI 2026-10-30 "approve all" (round 4): page page card I01 slot 13'
    support_required: true
    downgrade_target: tag_only
    threshold: &id002
