        Missing-value tokens: one reserved set of four: "not asked" (`not_applicable` renamed "not asked" everywhere, T2) when a rule skipped the question; "not documented"; "unknown"; and `_NA_` for items on a row that has no activity. The temporary part answer of R-044 is not a reserved token. Exception: on pages whose verdict shows no GenAI, the description items and `content_data` take `no`, not "not asked". New and non-frozen fields adopt it; frozen CX items keep their signed spellings with a mapping row.
