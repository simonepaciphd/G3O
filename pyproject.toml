[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "g3o"
version = "0.1.0"
description = "Production data-collection pipeline for the Global Government GenAI Observatory."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Simone Paci", email = "spaci@stanford.edu" },
]
keywords = ["government", "AI", "GenAI", "public sector", "research", "open data"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "requests>=2.31",
    "tenacity>=8.2",
    "beautifulsoup4>=4.12",
    "pdfplumber>=0.10",
    "python-docx>=1.0",
    "python-dotenv>=1.0",
    # Upper bound is deliberate; see the note in requirements.txt. openai 3.x
    # swapped httpx for httpx2 and is untested against this pipeline.
    "openai>=1.30,<3",
    "pydantic>=2.5",
    "pyyaml>=6.0",
    "playwright>=1.40",
    # eTLD+1 for the own-domain-relevant-hit metric (g3o.report.discovery_yield).
    # Configured offline there (suffix_list_urls=()), so it never fetches the
    # public-suffix list at runtime and a score stays reproducible.
    "tldextract>=5.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5",
    "ruff>=0.4",
    # tests/test_batch_client.py imports httpx directly to build the transport
    # errors the retry paths are asserted against. It was never declared and
    # rode in transitively via openai; declared here so the test suite states
    # its own dependency rather than inheriting one.
    "httpx>=0.27",
]

[project.scripts]
g3o = "g3o.cli:main"

[project.urls]
Repository = "https://github.com/simonepaciphd/G3O"
Website = "https://simonepaciphd.github.io/g3o-website/"

[tool.setuptools.packages.find]
include = ["g3o*"]

[tool.setuptools.package-data]
"g3o.extract.prompts" = ["*.md"]
"g3o.validate.prompts" = ["*.md"]
# Signed language policies. Without this the mapping ships in the repo but not
# in the wheel, and a config naming a policy id would fail on the droplet with
# UnknownPolicyError while passing every test on the laptop.
# Attached to ``g3o.common`` rather than declared as its own package: the
# directory holds data, not code, and giving it an ``__init__.py`` purely to
# satisfy ``packages.find`` would invent a module nobody imports.
"g3o.common" = ["policies/*.json"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "network: tests that hit the live network",
]

# Coverage is invoked explicitly in CI (the `coverage` job), not via addopts, so
# the documented baseline command `pytest -q -m "not network"` stays unchanged
# for local/dev runs. The CI gate floor (--cov-fail-under) lives in the workflow.
[tool.coverage.run]
source = ["g3o"]
branch = false

[tool.coverage.report]
show_missing = true
