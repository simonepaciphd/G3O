name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check .

      - name: Test (pytest)
        run: pytest -q -m "not network"

      - name: Network test (example.com scrape) — best-effort
        run: pytest -q -m network
        continue-on-error: true

      - name: Serper smoke (live API) — best-effort
        env:
          SERPER_API_KEY: ${{ secrets.SERPER_API_KEY }}
        run: |
          python -c "
          from g3o.discovery.serper_client import search_google
          results = search_google('test query', num_results=1, force_refresh=True)
          print(f'Serper returned {len(results)} result(s)')
          "
        continue-on-error: true
