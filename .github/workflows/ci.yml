name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check .

      - name: Test (pytest)
        run: pytest -q -m "not network"

  coverage:
    # Coverage gate (review F22 / WS4 T5). Runs the non-network suite once under
    # coverage and fails if total line coverage drops below the floor. The floor
    # is set ~5 points under the 2026-06-11 baseline (85%) so routine churn does
    # not trip it; ratchet it upward as coverage improves. Kept off the matrix
    # `test` job's command so the documented baseline (`pytest -q -m "not
    # network"`) stays unchanged for local runs.
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Test with coverage gate
        run: pytest -m "not network" --cov=g3o --cov-report=term-missing --cov-fail-under=80

  wheel-install:
    # Non-editable install smoke (review F10/F22): the editable `test` job never
    # exercises packaging, so a missing __init__.py / package-data entry (e.g.
    # the Stage 6 validate prompts) ships a broken wheel that only fails at
    # import time. Build a wheel, install it into a clean venv, and import every
    # g3o module — importing g3o.validate.client / g3o.extract.client loads their
    # on-disk prompt assets, so a wheel missing them fails here.
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Build wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build --wheel

      - name: Install wheel (non-editable) and import every module
        run: |
          python -m venv /tmp/wheel-venv
          /tmp/wheel-venv/bin/pip install --upgrade pip
          /tmp/wheel-venv/bin/pip install dist/*.whl
          /tmp/wheel-venv/bin/python - <<'PY'
          import importlib
          import pkgutil

          import g3o

          failures = []
          for mod in pkgutil.walk_packages(g3o.__path__, g3o.__name__ + "."):
              try:
                  importlib.import_module(mod.name)
              except Exception as exc:  # noqa: BLE001
                  failures.append(f"{mod.name}: {exc!r}")
          if failures:
              raise SystemExit(
                  "module import failures from non-editable wheel:\n  "
                  + "\n  ".join(failures)
              )
          print("OK: all g3o modules import from the installed wheel")
          PY

  network:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Network test (example.com scrape) — best-effort
        run: pytest -q -m network
        continue-on-error: true

      - name: Serper smoke (live API) — best-effort
        env:
          SERPER_API_KEY: ${{ secrets.SERPER_API_KEY }}
        run: |
          python -c "
          from g3o.discovery.serper_client import search_google
          results = search_google('test query', num_results=1, force_refresh=True)
          print(f'Serper returned {len(results)} result(s)')
          "
        continue-on-error: true
