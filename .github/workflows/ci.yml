name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# Project checks run without network, including child processes. Package/setup
# downloads remain outside the namespace; no provider secrets enter this workflow.
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint (ruff)
        run: sudo unshare --net -- env "PATH=$PATH" "$(command -v python)" .github/scripts/offline.py -m ruff check . .github/scripts

      - name: Test (pytest)
        run: sudo unshare --net -- env "PATH=$PATH" "$(command -v python)" .github/scripts/offline.py -m pytest -q -m "not network"

  codebook:
    # Codebook drift and generator checks (T-013; RC-D-002 A; item-template §4).
    # The drift step regenerates every file under g3o/codebook/generated/ from
    # codebook/codebook.yaml and fails on any byte difference (check 5): generated
    # files are never edited by hand. The checks step runs generator checks 1-16
    # on the codebook (R-007, A-001); a failure there is fixed by a codebook
    # delta and a re-signature, never by loosening a check.
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Codebook drift (check 5)
        run: sudo unshare --net -- env "PATH=$PATH" "$(command -v python)" .github/scripts/offline.py -m g3o.codebook drift

      - name: Codebook generator checks 1-16
        run: sudo unshare --net -- env "PATH=$PATH" "$(command -v python)" .github/scripts/offline.py -m g3o.codebook checks --verbose

  coverage:
    # Coverage gate (review F22 / WS4 T5). Runs the non-network suite once under
    # coverage and fails if total line coverage drops below the floor. The floor
    # is set ~5 points under the 2026-06-11 baseline (85%) so routine churn does
    # not trip it; ratchet it upward as coverage improves. Kept off the matrix
    # `test` job's command so the documented baseline (`pytest -q -m "not
    # network"`) stays unchanged for local runs.
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Test with coverage gate
        run: sudo unshare --net -- env "PATH=$PATH" "$(command -v python)" .github/scripts/offline.py -m pytest -m "not network" --cov=g3o --cov-report=term-missing --cov-fail-under=80

  wheel-install:
    # Non-editable install smoke (review F10/F22): the editable `test` job never
    # exercises packaging, so a missing __init__.py / package-data entry (e.g.
    # the Stage 6 validate prompts) ships a broken wheel that only fails at
    # import time. Build a wheel, install it into a clean venv, and import every
    # g3o module — importing g3o.validate.client / g3o.extract.client loads their
    # on-disk prompt assets, so a wheel missing them fails here.
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Build wheel
        run: |
          python -m pip install --upgrade pip build setuptools wheel
          sudo unshare --net -- env "PATH=$PATH" "$(command -v python)" .github/scripts/offline.py -m build --wheel --no-isolation

      - name: Install wheel (non-editable) and import every module
        run: |
          python -m venv /tmp/wheel-venv
          /tmp/wheel-venv/bin/pip install --upgrade pip
          /tmp/wheel-venv/bin/pip install dist/*.whl
          # Run from /tmp so the checkout cannot mask missing wheel contents.
          sudo unshare --net -- env "PATH=$PATH" bash -c '
            cd /tmp
            /tmp/wheel-venv/bin/python "$1/.github/scripts/offline.py" "$1/.github/scripts/check_wheel.py"
          ' _ "$GITHUB_WORKSPACE"
